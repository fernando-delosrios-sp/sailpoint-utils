  /v1/entroKeys/config:
    put:
      tags:
      - Entro API Keys
      summary: Configure API Key Expiration Settings
      description: Set the maximum and default expiration days for API keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxExpiry:
                  type: integer
                  minimum: 1
                  maximum: 3650
                  description: Maximum allowed expiration days for API keys
                  example: 365
                defaultExpiry:
                  type: integer
                  minimum: 1
                  maximum: 3650
                  description: Default expiration days pre-filled when creating API
                    keys
                  example: 90
            example:
              maxExpiry: 365
              defaultExpiry: 90
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              example:
                maxExpiry: 365
                defaultExpiry: 90
        '400':
          description: Validation error
          content:
            application/json:
              example:
                message: defaultExpiry (180) cannot exceed maxExpiry (90)
  /v1/entroKeys/{provider}/webhook:
    post:
      tags:
      - Entro API Keys
      summary: Generate Webhook Credentials for a Provider
      description: Generates webhook authentication credentials for real-time secret
        scanning via the specified provider. Uses the customer's configured default
        expiration from /v1/entroKeys/config.
      parameters:
      - name: provider
        in: path
        required: true
        description: The webhook provider to generate credentials for
        schema:
          type: string
          enum:
          - github
          - gitlab
      responses:
        '200':
          description: Webhook credentials generated successfully
          content:
            application/json:
              example:
                webhook: https://app.entro.security/api/entroApi/webhooks/github/12345678-1234-1234-1234-123456789123
                Authorization: ent_**************************************************
        '404':
          description: Unsupported provider
          content:
            application/json:
              example:
                message: 'Unsupported provider. Must be one of: github, gitlab'
