    get:
      tags:
      - User Audit Log
      summary: List user audit log entries
      description: Returns a paginated list of user actions ordered by date (newest
        first). Supports cursor-based pagination and optional filtering by user email.
      parameters:
      - name: email
        in: query
        required: false
        description: Filter entries by user email address
        schema:
          type: string
          example: user@example.com
      - name: limit
        in: query
        required: false
        description: Maximum number of entries to return (1-1000, default 100)
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: nextToken
        in: query
        required: false
        description: Pagination cursor returned from a previous response
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              example:
                items:
                - id: 42
                  userId: user-abc123
                  email: user@example.com
                  action: ADD_ACCOUNT
                  date: '2026-05-21T10:30:00.000Z'
                nextToken: eyJkYXRlIjoiMjAyNi0wNS0yMVQxMDozMDowMC4wMDBaIiwiaWQiOjQyfQ
                hasNext: true
        '400':
          description: Invalid query parameters
        '403':
          description: Invalid API key
