name: ferspec
version: 1
description: |
  Lean OpenSpec workflow — discovery, proposal, design, Gherkin specs, tasks, apply.
  Matt Pocock skills for execution. Direct PR for bug fixes and typos.
artifacts:
  - id: discovery
    generates: discovery.md
    description: Thought process — scope, language, decisions, open questions, scenarios discussed
    template: discovery.md
    instruction: |
      Write discovery.md using @./templates/discovery.md.

      Scope not locked → invoke **grill-with-docs** (routes **grilling** + **domain-modeling**).
      Output stays in this change's discovery.md — not repo-root CONTEXT.md.

      Scope locked → write discovery.md manually; skip grilling.

      **Language**: CONTEXT-FORMAT style (@domain-modeling CONTEXT-FORMAT.md). Mark each term
      `draft`, `conflicts-with-canonical`, or `promote`. Conflict-check
      `openspec/specs/ubiquitous-language/spec.md`.

      Terms marked `promote` → ubiquitous-language delta during specs phase — not here
      (canonical merge at archive).

      Done when every section has content or an explicit deferral before proposal.
    requires: []

  - id: proposal
    generates: proposal.md
    description: Why, capabilities, impact — extracted from discovery
    template: proposal.md
    instruction: |
      Extract from discovery.md — do not re-grill.

      Write proposal.md using @./templates/proposal.md: Why, What Changes, Capabilities, Impact.
      Resolve discovery Open questions or carry them forward explicitly.

      Done when Capabilities lists every spec the specs phase will create or modify.
    requires:
      - discovery

  - id: design
    generates: design.md
    description: Structured architecture from discovery; optional C4 when 3+ containers
    template: design.md
    instruction: |
      Extract from discovery.md — do not re-grill or re-explore.

      Write design.md using @./templates/design.md: Context, Goals/Non-Goals, Decisions,
      Risks/Trade-offs, Migration Plan, Open Questions.

      **C4 diagram (conditional)** — change touches 3+ containers (apps, services, databases,
      queues, external systems):
      - Invoke **c4-diagram** via Skill tool when present.
      - Write `diagrams/<change-name>.drawio` in this change directory.
      - Link from design.md §Architecture.
      - Skill absent → skip diagram; do not block design.

      Fewer than 3 containers or no structural change → omit §Architecture link.

      Done when design.md reflects discovery decisions without re-opening settled forks.
    requires:
      - discovery

  - id: specs
    generates: "specs/**/*.md"
    description: Gherkin-style delta specs; promote discovery Language terms
    template: spec.md
    instruction: |
      Write one delta spec per capability in proposal Capabilities using @./templates/spec.md.

      Invoke **gherkin-authoring** via Skill tool when present.

      **Promote Language**: terms marked `promote` in discovery.md → ADDED or MODIFIED entries
      in `specs/ubiquitous-language/spec.md` (or the project's ubiquitous-language spec).

      OpenSpec wrapper: `### Requirement:` + `#### Scenario:` (exact four hashes).
      Scenario steps: **GIVEN** / **WHEN** / **THEN** (+ **AND**). Requirements use SHALL or MUST.

      MODIFIED: copy the full requirement block from `openspec/specs/<capability>/spec.md`, edit,
      paste under `## MODIFIED Requirements`. Partial diffs fail at archive.

      One scenario per behavior — when a decision changes later, rewrite the affected scenario
      title and steps together rather than adding a parallel scenario beside it.

      Done when every proposal capability has a delta spec and every requirement has ≥1 scenario.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Checkbox tasks with mandatory Documentation and Changelog groups
    template: tasks.md
    instruction: |
      Write tasks.md using @./templates/tasks.md exactly — apply parses `- [ ]` checkboxes.

      Group implementation work under numbered ## headings. Each task: `- [ ] X.Y description`.

      **Mandatory closing groups** (never omit):
      - **Documentation** — concrete doc files from proposal Impact
      - **Changelog** — entry created during apply via **changelog-generator**

      Include a task to record the project's canonical test command when not obvious from the repo.

      Done when every spec scenario and design decision maps to at least one task.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Invoke **apply-code-changes** via Skill tool when present (OpenSpec adapter for `/opsx:apply`;
    Direct adapter for explicit task folders). Venue, bind, and handoff live in the skill only.

    Pre-flight: run `openspec status --change "<name>" --json` and
    `openspec instructions apply --change "<name>" --json` (append `--store` when set) for paths
    and `operationGuidance`. After bind, artifact I/O uses `ACTIVE_CHANGE_ROOT` on the bound checkout.

    **Fallback** (skill absent): execute tasks in order; invoke **tdd** when present; delegate
    commits to **git-commit**; run **changelog-generator** for the Changelog group.

    **Delta spec reconciliation** (apply owns this): when shipped behavior diverges from a
    scenario — a design fork re-resolved mid-apply — edit this change's `specs/**` as the
    divergence happens. Rewrite the steps and rename the title together; delete scenarios the
    new design supersedes instead of leaving them beside their replacements; keep
    `specs/ubiquitous-language/spec.md` entries matching shipped behavior. Superseded titles
    over rewritten bodies fail verify.

    **Verify** (blocking last gate before handoff): run `/opsx:verify` on the verification ref
    until CRITICAL, WARNING, and SUGGESTION are all empty. Fix every issue autonomously; repeat
    after each fix. Findings that recommend a later phase ("before archive") are still apply's
    when the fix lives inside the change directory. End with a **confirmation scorecard** pass
    (scorecard-only — no new hunting).
    Worktree: squash `apply-<name>` → `ORIGINAL_BRANCH` on main repo before verify.

    **Never in apply**: archive, spec sync (delta → canonical `openspec/specs/`), archive commit,
    `/opsx:archive`. Editing this change's own delta specs is not spec sync.

    Done when verify tiers are empty, delta specs match shipped behavior, and venue handoff
    completes.
