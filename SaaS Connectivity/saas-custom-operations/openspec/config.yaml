schema: superpowers-bridge

context: |
  Project: saas-custom-operations — a SailPoint Identity Security Cloud (ISC) SaaS connector
  that serves as a placeholder scaffold for custom connector operations.

  Tech stack:
  - TypeScript 4.x, Node.js
  - @sailpoint/connector-sdk (^1.0.0) — ISC connector framework
  - Vitest for unit tests (60% statement coverage threshold)
  - @vercel/ncc for bundling; spcx CLI for local run and packaging

  Architecture:
  - src/index.ts — connector entry point; registers std:* command handlers
  - src/my-client.ts — target application client (currently mock data)
  - connector-spec.json — ISC connector manifest (commands, sourceConfig, accountSchema)

  Supported std commands:
  - std:test-connection — verify connectivity and credentials
  - std:account:list — aggregate accounts for aggregation
  - std:account:read — read a single account by identity

  Configuration:
  - Token-based authentication via sourceConfig (connector-spec.json)
  - Account schema: firstName, lastName, email (identity attribute: email)

  Conventions:
  - Prettier: 120 print width, 4-space tabs, no semicolons, single quotes
  - Connector exported as module property named `connector`
  - Package privately scoped; build via `npm run build`, test via `npm test`

rules:
  global:
    - Always use the `changelog-generator` skill to maintain and enforce a changelog for all changes.
    - Preserve SailPoint connector-sdk patterns — do not deviate from std command handler signatures.
    - All new std operations must be declared in connector-spec.json before implementation.
  brainstorm:
    - Focus on connector operation scope, target API constraints, and ISC integration points.
    - Do not write to docs/superpowers/specs/ — output stays in the change directory.
  proposal:
    - Keep proposals under 2 pages; emphasize Why and Capabilities over implementation detail.
    - Reuse existing openspec/specs/ capability names before proposing new ones.
  design:
    - Document authentication strategy, error handling, and account/entitlement mapping decisions.
    - Include rollback/migration notes when changing connector-spec.json or account schema.
  specs:
    - Write requirements with GIVEN/WHEN/THEN scenarios for each std command behavior.
    - Use SHALL/MUST for normative connector contract language.
    - Map scenarios to Vitest test cases in src/*.spec.ts.
  tasks:
    - Include connector-spec.json updates when adding or modifying std commands.
    - Break tasks into chunks completable in one session; cover all spec scenarios with tests.
  plan:
    - Record `npm test` as the canonical test command.
    - Include spcx run/pack-zip validation for integration-sensitive changes.
  verify:
    - Confirm connector-spec.json commands align with registered handlers in src/index.ts.
    - Ensure Vitest coverage thresholds (60% statements, 50% branches) are met.
  retrospective:
    - Compare plan-vs-actual for connector operation additions and schema changes.
