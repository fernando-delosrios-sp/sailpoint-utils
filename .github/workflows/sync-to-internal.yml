name: Sync main to internal

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-main-to-internal
  cancel-in-progress: false

jobs:
  merge-to-internal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout internal repository
        uses: actions/checkout@v4
        with:
          repository: fernando-delosrios-sp/sailpoint-utils-internal
          ref: internal
          token: ${{ secrets.INTERNAL_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Fetch public main
        run: |
          git remote add public https://github.com/fernando-delosrios-sp/sailpoint-utils.git
          git fetch public main

      - name: Merge main into internal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge public/main --no-edit -m "Merge branch 'main' into internal [sync]"

      - name: Push internal branch
        run: git push origin internal
