name: Sync main to sailpoint

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-main-to-sailpoint
  cancel-in-progress: false

jobs:
  merge-to-sailpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sailpoint repository
        uses: actions/checkout@v4
        with:
          repository: sailpoint-se/sailpoint-utils
          ref: sailpoint
          token: ${{ secrets.INTERNAL_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Fetch public main
        run: |
          git remote add public https://github.com/fernando-delosrios-sp/sailpoint-utils.git
          git fetch public main

      - name: Merge main into sailpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge public/main --no-edit -m "Merge branch 'main' into sailpoint [sync]"
          # This workflow runs from the public repo only; exclude it from the
          # sailpoint mirror so the sync token does not need the workflow scope.
          if git ls-files --error-unmatch .github/workflows/sync-to-sailpoint.yml >/dev/null 2>&1; then
            git rm .github/workflows/sync-to-sailpoint.yml
            git commit -m "chore: exclude public-only sync workflow from sailpoint mirror"
          fi

      - name: Push sailpoint branch
        run: git push origin sailpoint
