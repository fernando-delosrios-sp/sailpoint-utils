name: Apply to ISC

on:
  push:
    branches: [main]
    paths:
      - "access/**"
  # Lets an operator re-run apply against the current HEAD commit when a push
  # that should have triggered it did not — e.g. this workflow file was added
  # to the repo but GitHub never indexed it as a registered workflow, which
  # has happened on a live install despite the file being present on main
  # since day one. `gh workflow list` is the way to confirm that happened.
  workflow_dispatch: {}

concurrency:
  # Its own group: backup/readme/restore pushes share amcm-main-writers, and
  # GitHub only keeps the most recently queued run per group — a real apply
  # queued behind an in-progress writer was getting silently cancelled by the
  # next backup/readme push instead of running. Apply still serializes with
  # itself; its push steps rebase onto origin/main to reconcile with the
  # other writers instead of racing them.
  group: amcm-apply
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  apply:
    # These commits already reflect ISC, or are this workflow's own follow-up.
    # Applying them again records a change that has no pull request: the
    # history row comes out as ref #0 and a blank author.
    if: ${{ !contains(github.event.head_commit.message, 'chore(init):') && !contains(github.event.head_commit.message, 'chore(restore):') && !contains(github.event.head_commit.message, 'chore(backup):') && !contains(github.event.head_commit.message, 'chore(apply):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AMCM_APP_ID }}
          private-key: ${{ secrets.AMCM_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node scripts/public-npm-ci.mjs

      - name: Skip bot-only commits without access content change
        id: gate
        run: |
          # The Init baseline is already the live ISC snapshot. It has no parent,
          # and applying it would try to recreate every item.
          if ! git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            echo "Root commit; skip apply."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A normal push only ever carries one access/** commit (that's what
          # triggered this run), so diffing against its immediate parent is
          # correct and keeps applies small. A manual workflow_dispatch has no
          # such guarantee — it's the recovery path for when a push-triggered
          # run never happened at all (e.g. GitHub failed to register this
          # workflow), so one or more access/** commits may already be
          # sitting unapplied on main. Diff from the last known-good snapshot
          # instead so a manual run catches everything since the last real
          # apply, not just the tip commit.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE=$(git describe --tags --match 'known-good/*' --abbrev=0 2>/dev/null || echo HEAD~1)
          else
            BASE=HEAD~1
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$BASE" HEAD | grep -q '^access/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PR for this push
        if: steps.gate.outputs.run == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # `.[0]` on an empty array is `null`, and `null | {a,b}` still
          # builds an object of nulls rather than nothing — pipe through
          # `// empty` first so a commit with no PR truly yields "".
          PR=$(gh pr list --search "${{ github.sha }}" --state merged --json number,title,url,author --jq '.[0] // empty')
          if [ -z "$PR" ]; then
            # Fallback: look at associated PRs for the commit
            PR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq '.[0] // empty | {number,title,url,author:.user.login}' || echo '')
          fi
          if [ -z "$PR" ]; then
            # A manual dispatch recovery run can apply several commits at
            # once (see the gate step) — the tip commit may not itself be a
            # PR merge (e.g. we're on top of an unrelated follow-up commit),
            # so walk every commit since the base looking for its PR.
            for sha in $(git log --format=%H "${{ steps.gate.outputs.base }}..HEAD"); do
              PR=$(gh api "repos/${{ github.repository }}/commits/$sha/pulls" \
                --jq '.[0] // empty | {number,title,url,author:.user.login}' 2>/dev/null || echo '')
              [ -n "$PR" ] && break
            done
          fi
          echo "payload=$PR" >> "$GITHUB_OUTPUT"
          echo "$PR" > /tmp/pr.json
          NUMBER=$(echo "$PR" | jq -r '.number // empty')
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build plan against previous commit
        if: steps.gate.outputs.run == 'true'
        run: |
          node --input-type=module <<'EOF'
          import { writeFileSync } from 'node:fs';
          import { loadItemsFromGitRef } from './scripts/git-items.mjs';
          import { loadAllItems } from './scripts/common.mjs';
          import { buildPlan } from './scripts/plan.mjs';

          const plan = buildPlan({
            baseItems: loadItemsFromGitRef('${{ steps.gate.outputs.base }}'),
            headItems: loadAllItems(),
          });
          writeFileSync('plan.json', JSON.stringify(plan, null, 2));
          console.log(JSON.stringify(plan.summary, null, 2));
          EOF

      - name: Apply to ISC
        if: steps.gate.outputs.run == 'true'
        id: apply
        env:
          ISC_TENANT_URL: ${{ secrets.ISC_TENANT_URL }}
          ISC_CLIENT_ID: ${{ secrets.ISC_CLIENT_ID }}
          ISC_CLIENT_SECRET: ${{ secrets.ISC_CLIENT_SECRET }}
        run: |
          set +e
          node scripts/cli.mjs apply --plan plan.json > /tmp/apply.json
          CODE=$?
          set -e
          cat /tmp/apply.json
          OK=$(jq -r '.ok' /tmp/apply.json)
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          if [ "$OK" != "true" ]; then
            exit 1
          fi

      - name: Commit id write-backs
        if: steps.gate.outputs.run == 'true' && steps.apply.outputs.ok == 'true'
        run: |
          git config user.name "amcm-bot"
          git config user.email "amcm-bot[bot]@users.noreply.github.com"
          git add access/
          git diff --cached --quiet || git commit -m "chore(apply): write back ISC ids"
          # Apply now runs in its own concurrency group, so a backup/readme
          # push to main can land mid-run. Rebase instead of racing it.
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i), rebasing onto origin/main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done

      - name: Create known-good tag
        if: steps.gate.outputs.run == 'true' && steps.apply.outputs.ok == 'true'
        id: tag
        run: |
          PR=${{ steps.pr.outputs.number }}
          if [ -n "$PR" ]; then
            TAG=$(node -e "import('./scripts/tags.mjs').then(m => console.log(m.buildKnownGoodTagName({ prNumber: $PR })))")
          else
            TAG=$(node -e "import('./scripts/tags.mjs').then(m => console.log(m.buildKnownGoodTagName()))")
          fi
          node scripts/cli.mjs tag-known-good --tag "$TAG" --message "Known-good snapshot for PR #${PR:-manual}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ledger + README
        if: steps.gate.outputs.run == 'true' && steps.apply.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          PR_NUM=${{ steps.pr.outputs.number }}
          TAG=${{ steps.tag.outputs.tag }}
          # An empty /tmp/pr.json makes jq exit 0 with no output, so `|| echo`
          # never runs and the ledger is stored with a blank author and title.
          AUTHOR=$(jq -r '.author.login // .author // empty' /tmp/pr.json 2>/dev/null || true)
          TITLE=$(jq -r '.title // empty' /tmp/pr.json 2>/dev/null || true)
          URL=$(jq -r '.url // empty' /tmp/pr.json 2>/dev/null || true)
          [ -n "$AUTHOR" ] || AUTHOR=unknown
          [ -n "$TITLE" ] || TITLE=apply
          jq -n \
            --argjson pr "${PR_NUM:-null}" \
            --arg author "$AUTHOR" \
            --arg title "$TITLE" \
            --arg url "$URL" \
            --arg tag "$TAG" \
            --slurpfile apply /tmp/apply.json \
            '{
              prNumber: $pr,
              author: $author,
              title: $title,
              url: $url,
              diffHash: null,
              approvers: [],
              decisions: [{decision:"approved", source:"isc"}],
              applyResult: $apply[0],
              tag: $tag
            }' | node scripts/cli.mjs ledger-change
          node scripts/cli.mjs readme
          git add changes/ README.md access/
          git diff --cached --quiet || git commit -m "chore(apply): ledger and README for $TAG"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i), rebasing onto origin/main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done

      - name: Open apply failure issue
        if: failure() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ -f /tmp/apply.json ]; then
            BODY=$(jq -r '"Apply stopped.\n\n```json\n" + tostring + "\n```"' /tmp/apply.json)
          else
            BODY="Apply failed before producing a result. See workflow logs."
          fi
          gh issue create --title "Apply failed on ${{ github.sha }}" --body "$BODY" || true
