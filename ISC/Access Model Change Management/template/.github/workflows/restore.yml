name: Restore

# No inputs: the restore source is whatever ref is picked in "Use workflow
# from" — any branch or tag. The access/ tree at that ref becomes the desired
# state for ISC; scripts, schemas and config.yaml always come from main.
#
# Running this from a tag created before this workflow lost its `tag` input
# uses that tag's older definition, which still asks for the tag name.
on:
  workflow_dispatch: {}

concurrency:
  group: amcm-restore-request
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install from main package lock
        run: |
          git checkout origin/main -- package.json package-lock.json scripts schemas config.yaml
          node scripts/public-npm-ci.mjs

      - name: Build full restore plan vs live ISC
        env:
          ISC_TENANT_URL: ${{ secrets.ISC_TENANT_URL }}
          ISC_CLIENT_ID: ${{ secrets.ISC_CLIENT_ID }}
          ISC_CLIENT_SECRET: ${{ secrets.ISC_CLIENT_SECRET }}
        run: |
          # Working tree is the selected ref's content under access/
          node scripts/cli.mjs restore --out plan.json
          cat plan.json
          echo "PLAN_HASH=$(jq -r .planHash plan.json)" >> "$GITHUB_ENV"

      - name: Request ISC restore approval (kind=restore, governance group only)
        env:
          ISC_EXTERNAL_TRIGGER_URL: ${{ secrets.ISC_TRIGGER_URL }}
          ISC_EXTERNAL_TRIGGER_CLIENT_ID: ${{ secrets.ISC_TRIGGER_CLIENT_ID }}
          ISC_EXTERNAL_TRIGGER_CLIENT_SECRET: ${{ secrets.ISC_TRIGGER_CLIENT_SECRET }}
          ISC_TENANT_URL: ${{ secrets.ISC_TENANT_URL }}
        run: |
          node scripts/cli.mjs request-approval \
            --kind restore \
            --plan plan.json \
            --ref "${{ github.ref_name }}" \
            --author "${{ github.actor }}"

      - name: Summary
        run: |
          echo "### Restore approval requested" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Plan hash: \`$PLAN_HASH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "The governance group will find this in their ISC approvals. On approval, the decision callback applies it." >> "$GITHUB_STEP_SUMMARY"
