name: Request ISC Approval

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "access/**"
  issue_comment:
    types: [created]

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  request:
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && !startsWith(github.head_ref, 'drift/')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/request-approval'))
    runs-on: ubuntu-latest
    steps:
      # Resolved before checkout, and with --repo rather than relying on a
      # git remote, so it works with no checkout yet. On issue_comment there
      # is no github.event.pull_request — the old checkout's
      # `github.event.pull_request.head.sha || github.sha` fell through to
      # github.sha, the default branch tip, not the PR. /request-approval
      # then built and approved an empty main-vs-main plan while the PR
      # comment still quoted the real (unapproved) diff hash — seen live:
      # governance would have approved a no-op. Resolving the PR first and
      # checking out its real head below fixes both event types the same way.
      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            NUMBER=${{ github.event.issue.number }}
          else
            NUMBER=${{ github.event.pull_request.number }}
          fi
          # /tmp, not the workspace: checkout below runs `git clean -ffdx` on
          # the workspace directory, which would delete a file written here
          # before anything is checked out into it.
          gh pr view "$NUMBER" --repo "${{ github.repository }}" \
            --json number,title,body,url,author,baseRefName,headRefName,headRefOid > /tmp/pr.json
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .headRefOid /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .headRefName /tmp/pr.json)" >> "$GITHUB_OUTPUT"

      - name: Refuse change approval on a drift pull request
        if: startsWith(steps.pr.outputs.head, 'drift/')
        run: |
          echo "::error::This pull request records drift. Approve it in ISC; merging is the drift decision, not a change."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node scripts/public-npm-ci.mjs

      - name: Build plan and diff hash
        run: |
          BASE=$(jq -r .baseRefName /tmp/pr.json)
          node --input-type=module <<EOF
          import { writeFileSync } from 'node:fs';
          import { loadItemsFromGitRef, changedAccessFiles } from './scripts/git-items.mjs';
          import { loadAllItems } from './scripts/common.mjs';
          import { buildPlan } from './scripts/plan.mjs';
          import { hashTouchedFiles } from './scripts/diff-hash.mjs';

          const baseRef = 'origin/${BASE}';
          const plan = buildPlan({
            baseItems: loadItemsFromGitRef(baseRef),
            headItems: loadAllItems(),
          });
          const files = changedAccessFiles(baseRef);
          const diffHash = hashTouchedFiles(files);
          writeFileSync('plan.json', JSON.stringify({ ...plan, diffHash, files }, null, 2));
          EOF

      - name: Clear previous approval status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=${{ steps.pr.outputs.sha }}
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=pending \
            -f context=isc-approval \
            -f description="Awaiting ISC approval"

      - name: Trigger ISC approval workflow (kind=change)
        env:
          ISC_EXTERNAL_TRIGGER_URL: ${{ secrets.ISC_TRIGGER_URL }}
          ISC_EXTERNAL_TRIGGER_CLIENT_ID: ${{ secrets.ISC_TRIGGER_CLIENT_ID }}
          ISC_EXTERNAL_TRIGGER_CLIENT_SECRET: ${{ secrets.ISC_TRIGGER_CLIENT_SECRET }}
          ISC_TENANT_URL: ${{ secrets.ISC_TENANT_URL }}
        run: |
          DIFF_HASH=$(jq -r .diffHash plan.json)
          # Enrich pr.json for the approval payload
          jq --arg author "$(jq -r .author.login /tmp/pr.json)" \
            --arg headSha "$(jq -r .headRefOid /tmp/pr.json)" \
            '. + {author: $author, headSha: $headSha, number: .number}' /tmp/pr.json > pr-payload.json
          node scripts/cli.mjs request-approval \
            --kind change \
            --plan plan.json \
            --pr pr-payload.json \
            --diff-hash "$DIFF_HASH" > /tmp/request-approval.json
          cat /tmp/request-approval.json

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=${{ steps.pr.outputs.number }}
          HASH=$(jq -r .diffHash plan.json)
          BODY="ISC approval requested for diff hash \`$HASH\`. The governance group will find it in their Identity Security Cloud approvals."
          gh pr comment "$NUMBER" --body "$BODY"
