name: Backup

on:
  schedule:
    # Default; installer rewrites from config.yaml backup.schedule
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # The drift branch and its pull request are written here. main is not:
      # approval-callback.yml merges that pull request once the governance
      # group approves, and that merge is what copies ISC into git.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node scripts/public-npm-ci.mjs

      - name: Detect drift
        id: drift
        env:
          ISC_TENANT_URL: ${{ secrets.ISC_TENANT_URL }}
          ISC_CLIENT_ID: ${{ secrets.ISC_CLIENT_ID }}
          ISC_CLIENT_SECRET: ${{ secrets.ISC_CLIENT_SECRET }}
        run: |
          node scripts/cli.mjs drift --snapshot /tmp/isc-snapshot.json > /tmp/drift.json
          echo "has_drift=$(jq -r '.hasDrift' /tmp/drift.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/drift.json

      - name: Open the drift issue
        id: issue
        if: steps.drift.outputs.has_drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The issue is the readable record of this drift: who changed it,
          # every path, and the hash the decision is checked against. The
          # pull request opened next is the diff, and says Fixes #<this>.
          node scripts/cli.mjs drift-issue --drift /tmp/drift.json > /tmp/issue.json
          HASH=$(jq -r '.driftHash' /tmp/issue.json)
          jq -r '.body' /tmp/issue.json > /tmp/issue-body.md

          gh label create amcm-drift --color FBCA04 \
            --description "Drift between ISC and git awaiting a governance decision" \
            2>/dev/null || true

          # A backup that runs again before anyone decides must reuse the open
          # issue rather than filing a duplicate every night.
          URL=$(gh issue list --state open --label amcm-drift --limit 100 \
                  --json number,url,body \
                  --jq "[.[] | select(.body | contains(\"$HASH\"))][0].url // empty")
          if [ -z "$URL" ]; then
            URL=$(gh issue create --label amcm-drift \
                    --title "$(jq -r '.title' /tmp/issue.json)" \
                    --body-file /tmp/issue-body.md)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "number=${URL##*/}" >> "$GITHUB_OUTPUT"
          echo "Drift issue: $URL" >> "$GITHUB_STEP_SUMMARY"

      # The default GITHUB_TOKEN can push the branch, but this org does not let
      # GitHub Actions create pull requests. The app token is the one that can.
      - name: Generate GitHub App token
        id: app
        if: steps.drift.outputs.has_drift == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AMCM_APP_ID }}
          private-key: ${{ secrets.AMCM_APP_PRIVATE_KEY }}

      - name: Open the drift pull request
        id: pull_request
        if: steps.drift.outputs.has_drift == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Branch contents are the live ISC bodies. The pull request against
          # main is the same diff a change would show, and Fixes #<issue>
          # lists it as that issue's resolution. kind=change does not run for
          # drift/* heads; the drift approval below is the only decision.
          NUMBER="${{ steps.issue.outputs.number }}"
          node scripts/cli.mjs drift-pr --drift /tmp/drift.json \
            --snapshot /tmp/isc-snapshot.json --issue "$NUMBER" > /tmp/pr.json
          BRANCH=$(jq -r '.branch' /tmp/pr.json)
          jq -r '.body' /tmp/pr.json > /tmp/pr-body.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          node scripts/cli.mjs drift-materialize --drift /tmp/drift.json \
            --snapshot /tmp/isc-snapshot.json
          git add -A access
          git diff --cached --quiet && { echo "::error::Drift produced no file changes"; exit 1; }
          git commit -m "chore(backup): drift snapshot"
          # The bot owns this branch. A later backup of the same bodies rebases
          # the snapshot onto current main so the pull request stays mergeable.
          if git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
            git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          else
            git push -u origin "HEAD:refs/heads/$BRANCH"
          fi

          PR_URL=$(gh pr list --head "$BRANCH" --base main --state open \
                    --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create --base main --head "$BRANCH" --label amcm-drift \
                      --title "$(jq -r '.title' /tmp/pr.json)" \
                      --body-file /tmp/pr-body.md)
          fi

          # An older snapshot of this same issue is no longer the resolution.
          OLD=$(gh pr list --state open --label amcm-drift --limit 100 \
                  --json number,headRefName,body \
                  --jq ".[] | select(.body | contains(\"Fixes #$NUMBER\")) | select(.headRefName != \"$BRANCH\") | .number")
          for n in $OLD; do
            gh pr close "$n" --delete-branch \
              --comment "Superseded by a newer drift snapshot on \`$BRANCH\`."
          done

          node scripts/cli.mjs drift-issue --drift /tmp/drift.json --pr-url "$PR_URL" > /tmp/issue.json
          jq -r '.body' /tmp/issue.json > /tmp/issue-body.md
          gh issue edit "$NUMBER" --body-file /tmp/issue-body.md

          SHA=$(git rev-parse HEAD)
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=pending \
            -f context=isc-approval \
            -f description="Awaiting ISC drift approval"

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Drift pull request: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Request drift approval (kind=drift)
        if: steps.drift.outputs.has_drift == 'true'
        env:
          ISC_EXTERNAL_TRIGGER_URL: ${{ secrets.ISC_TRIGGER_URL }}
          ISC_EXTERNAL_TRIGGER_CLIENT_ID: ${{ secrets.ISC_TRIGGER_CLIENT_ID }}
          ISC_EXTERNAL_TRIGGER_CLIENT_SECRET: ${{ secrets.ISC_TRIGGER_CLIENT_SECRET }}
          ISC_TENANT_URL: ${{ secrets.ISC_TENANT_URL }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
        run: |
          # Drift does not auto-commit to main. The governance group decides
          # in ISC. Approving merges the pull request; that merge is the sync.
          node scripts/cli.mjs request-approval --kind drift --drift /tmp/drift.json \
            --issue-url "$ISSUE_URL" --pr-url "$PR_URL"
