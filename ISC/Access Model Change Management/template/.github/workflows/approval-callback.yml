name: ISC Approval Callback

on:
  repository_dispatch:
    types: [isc-change-decision, isc-restore-decision, isc-drift-decision]

permissions:
  contents: write
  statuses: write
  pull-requests: write
  issues: write

jobs:
  change-decision:
    if: github.event.action == 'isc-change-decision'
    runs-on: ubuntu-latest
    steps:
      # The merge below must land as the App, not the default GITHUB_TOKEN —
      # GitHub does not fire push-triggered workflows (apply.yml) for commits
      # made with the latter, so an ISC-approved change would merge cleanly
      # and never reach ISC. restore-decision and drift-decision already mint
      # this; change-decision is the one job that didn't.
      - name: Generate GitHub App token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AMCM_APP_ID }}
          private-key: ${{ secrets.AMCM_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node scripts/public-npm-ci.mjs

      - name: Verify decision against ISC
        id: verify
        env:
          ISC_TENANT_URL: ${{ secrets.ISC_TENANT_URL }}
          ISC_CLIENT_ID: ${{ secrets.ISC_CLIENT_ID }}
          ISC_CLIENT_SECRET: ${{ secrets.ISC_CLIENT_SECRET }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "$CLIENT_PAYLOAD" > /tmp/payload.json
          node --input-type=module <<'EOF'
          import { writeFileSync } from 'node:fs';
          import { IscClient } from './scripts/isc-client.mjs';

          const payload = JSON.parse(process.env.CLIENT_PAYLOAD);
          // ISC's dispatch step templates this from the governance approval's
          // comment. Seen live as a plain string on one path and the raw
          // {author,comment,...} comment record (or an array of those) on
          // another. Normalize to a string so a non-string value here can't
          // corrupt $GITHUB_OUTPUT below.
          const commentText = (raw) => {
            if (raw == null) return '';
            if (typeof raw === 'string') return raw;
            if (Array.isArray(raw)) return raw.map(commentText).filter(Boolean).join(' | ');
            if (typeof raw === 'object' && typeof raw.comment === 'string') return raw.comment;
            return '';
          };
          payload.comment = commentText(payload.comment);
          const client = IscClient.fromEnv();
          if (payload.executionId) {
            const exec = await client.getWorkflowExecution(payload.executionId);
            const status = exec.status ?? exec.executionStatus;
            writeFileSync('/tmp/verified.json', JSON.stringify({
              ok: true,
              status,
              decision: payload.decision,
              execution: exec,
              payload,
            }, null, 2));
          } else {
            // Soft verify when execution id is absent: trust payload shape, record warning
            writeFileSync('/tmp/verified.json', JSON.stringify({
              ok: true,
              warning: 'No executionId in payload',
              decision: payload.decision,
              payload,
            }, null, 2));
          }
          EOF
          DECISION=$(jq -r '.decision // .payload.decision' /tmp/verified.json)
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "pr=$(jq -r '.payload.pr.number // .payload.prNumber' /tmp/verified.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r '.payload.headSha // empty' /tmp/verified.json)" >> "$GITHUB_OUTPUT"
          echo "diff_hash=$(jq -r '.payload.diffHash // empty' /tmp/verified.json)" >> "$GITHUB_OUTPUT"
          echo "comment=$(jq -r '.payload.comment // empty' /tmp/verified.json)" >> "$GITHUB_OUTPUT"

      - name: Approved — set status and enable auto-merge
        if: steps.verify.outputs.decision == 'approved'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          PR=${{ steps.verify.outputs.pr }}
          SHA=${{ steps.verify.outputs.sha }}
          if [ -z "$SHA" ]; then
            SHA=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          fi
          HASH=${{ steps.verify.outputs.diff_hash }}
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success \
            -f context=isc-approval \
            -f description="Approved (diff $HASH)"
          # --auto only works if the repo (or org) has "Allow auto-merge"
          # turned on — seen live to be off and not overridable via the repos
          # API (likely an org policy), where gh's merge call fails outright
          # with "Auto merge is not allowed for this repository" instead of
          # merging. There's no branch ruleset gating merge without that
          # feature either (installer skips rulesets the same way on this
          # plan), so a plain merge right now is just as safe as waiting for
          # auto-merge, and it does not leave an ISC-approved PR stuck open.
          set +e
          gh pr merge "$PR" --auto --squash 2>/tmp/merge.err
          STATUS=$?
          set -e
          if [ "$STATUS" != "0" ]; then
            cat /tmp/merge.err >&2
            gh pr merge "$PR" --squash || gh pr merge "$PR" --merge
          fi
          gh pr comment "$PR" --body "ISC approved (diff hash \`$HASH\`)."

      - name: Rejected — close PR
        if: steps.verify.outputs.decision == 'rejected'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # Via env:, not inline ${{ }} — the expression is substituted into
          # the script source before bash ever sees it, so an approver's
          # comment with a space (or shell metacharacters) was parsed as a
          # second command instead of a value, and the step died before
          # posting anything (seen live: "e2e-B: rejecting on purpose" aborted
          # here with "rejecting: command not found", leaving the PR open
          # with isc-approval still pending). env: + "$COMMENT" is one shell
          # word regardless of content.
          COMMENT: ${{ steps.verify.outputs.comment }}
        run: |
          PR=${{ steps.verify.outputs.pr }}
          SHA=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=failure \
            -f context=isc-approval \
            -f description="Rejected by ISC approver"
          gh pr comment "$PR" --body "ISC rejected this change.${COMMENT:+ Comment: $COMMENT}"
          gh pr close "$PR"

      - name: Expired — label PR
        if: steps.verify.outputs.decision == 'expired'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          PR=${{ steps.verify.outputs.pr }}
          SHA=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=failure \
            -f context=isc-approval \
            -f description="ISC approval expired"
          # Unlike amcm-drift (created by backup.yml before it's ever
          # applied), nothing creates approval-expired ahead of time. Without
          # it `gh pr edit --add-label` exits 1 on "label not found" and the
          # step dies before the comment below runs — seen live: the status
          # went to failure with no comment and no label, so the only clue
          # left for the PR author was a red check.
          gh label create "approval-expired" --color D93F0B \
            --description "ISC governance approval timed out before anyone decided" \
            2>/dev/null || true
          gh pr edit "$PR" --add-label "approval-expired"
          gh pr comment "$PR" --body "ISC approval expired. Comment \`/request-approval\` to try again."

  restore-decision:
    if: github.event.action == 'isc-restore-decision'
    runs-on: ubuntu-latest
    # Applying the restore reconciles main from ISC, same as drift sync, so it
    # shares that concurrency group.
    concurrency:
      group: amcm-main-writers
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AMCM_APP_ID }}
          private-key: ${{ secrets.AMCM_APP_PRIVATE_KEY }}

      # The approved source branch or tag; scripts come from main below, the
      # same split the Restore workflow uses when it builds the plan.
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.event.client_payload.sourceRef }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: |
          git checkout origin/main -- package.json package-lock.json scripts schemas config.yaml
          node scripts/public-npm-ci.mjs

      - name: Read the decision
        id: decision
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "$CLIENT_PAYLOAD" > /tmp/restore-decision.json
          REF=$(jq -r '.sourceRef // empty' /tmp/restore-decision.json)
          # An empty ref would have checked out the default branch above and
          # then applied main to ISC as if it were the approved source.
          if [ -z "$REF" ]; then
            echo "::error::Restore decision carries no sourceRef; refusing to apply."
            exit 1
          fi
          echo "value=$(jq -r '.decision' /tmp/restore-decision.json)" >> "$GITHUB_OUTPUT"
          echo "Restore of $REF: $(jq -r '.decision' /tmp/restore-decision.json)"

      - name: Rebuild and execute the approved restore plan
        if: steps.decision.outputs.value == 'approved'
        id: apply
        env:
          ISC_TENANT_URL: ${{ secrets.ISC_TENANT_URL }}
          ISC_CLIENT_ID: ${{ secrets.ISC_CLIENT_ID }}
          ISC_CLIENT_SECRET: ${{ secrets.ISC_CLIENT_SECRET }}
        run: |
          node scripts/cli.mjs restore --out plan.json
          ACTUAL=$(jq -r .planHash plan.json)
          EXPECTED=$(jq -r '.planHash // empty' /tmp/restore-decision.json)
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Live plan hash changed since approval ($ACTUAL vs $EXPECTED). Aborting."
            exit 1
          fi
          set +e
          node scripts/cli.mjs apply --plan plan.json > /tmp/apply.json
          set -e
          cat /tmp/apply.json
          OK=$(jq -r .ok /tmp/apply.json)
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          test "$OK" = "true"

      - name: Reconcile main from ISC and ledger
        if: steps.apply.outputs.ok == 'true'
        env:
          ISC_TENANT_URL: ${{ secrets.ISC_TENANT_URL }}
          ISC_CLIENT_ID: ${{ secrets.ISC_CLIENT_ID }}
          ISC_CLIENT_SECRET: ${{ secrets.ISC_CLIENT_SECRET }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git fetch origin main
          git checkout main
          node scripts/cli.mjs backup
          jq -n --slurpfile decision /tmp/restore-decision.json --slurpfile apply /tmp/apply.json \
            '{
              requester: $decision[0].requester,
              sourceRef: $decision[0].sourceRef,
              planHash: $decision[0].planHash,
              decision: $decision[0],
              applyResult: $apply[0]
            }' | node scripts/cli.mjs ledger-restore
          git fetch origin '+refs/tags/known-good/*:refs/tags/known-good/*' '+refs/tags/isc-applied/*:refs/tags/isc-applied/*'
          node scripts/cli.mjs readme
          git config user.name "amcm-bot"
          git config user.email "amcm-bot[bot]@users.noreply.github.com"
          git add access/ changes/ README.md
          git diff --cached --quiet || git commit -m "chore(restore): applied $(jq -r '.sourceRef' /tmp/restore-decision.json)"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i), rebasing onto origin/main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done

      - name: Failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          REF=$(jq -r '.sourceRef // "unknown"' /tmp/restore-decision.json 2>/dev/null || echo unknown)
          BODY="Restore of \`$REF\` failed. See workflow logs."
          if [ -f /tmp/apply.json ]; then
            BODY=$(jq -r '"Restore stopped.\n\n```json\n" + tostring + "\n```"' /tmp/apply.json)
          fi
          gh issue create --title "Restore failed: $REF" --body "$BODY" || true

  drift-decision:
    if: github.event.action == 'isc-drift-decision'
    runs-on: ubuntu-latest
    # Drift sync commits straight to main, same as restore's execute job, so it
    # shares that concurrency group even though it isn't a separate workflow.
    concurrency:
      group: amcm-main-writers
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AMCM_APP_ID }}
          private-key: ${{ secrets.AMCM_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node scripts/public-npm-ci.mjs

      - name: Re-detect drift and check it hasn't moved since approval
        id: verify
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          ISC_TENANT_URL: ${{ secrets.ISC_TENANT_URL }}
          ISC_CLIENT_ID: ${{ secrets.ISC_CLIENT_ID }}
          ISC_CLIENT_SECRET: ${{ secrets.ISC_CLIENT_SECRET }}
        run: |
          echo "$CLIENT_PAYLOAD" > /tmp/drift-decision.json
          # Same comment-shape quirk as the change-decision job: ISC's template
          # can resolve .comment to a plain string or to the raw comment
          # record/array depending on the path taken through the ISC workflow.
          # Normalize once so every downstream `.comment` read below is safe.
          jq '.comment |= (
                if type == "string" then .
                elif type == "object" then (.comment // "")
                elif type == "array" then ([.[] | (.comment // empty)] | join(" | "))
                else "" end)' \
            /tmp/drift-decision.json > /tmp/drift-decision.normalized.json
          mv /tmp/drift-decision.normalized.json /tmp/drift-decision.json
          echo "decision=$(jq -r '.decision' /tmp/drift-decision.json)" >> "$GITHUB_OUTPUT"
          EXPECTED_HASH=$(jq -r '.driftHash' /tmp/drift-decision.json)

          # Re-detect against live ISC rather than trusting a stashed snapshot —
          # ISC may have changed again between the approval request and this
          # decision landing (same staleness guard restore.yml uses for planHash).
          # --snapshot keeps that ISC read on disk so the sync/restore step below
          # does not enumerate the whole access model a second time.
          node scripts/cli.mjs drift --snapshot /tmp/isc-snapshot.json > /tmp/drift-now.json
          ACTUAL_HASH=$(jq -r .driftHash /tmp/drift-now.json)
          echo "stale=$([ "$ACTUAL_HASH" != "$EXPECTED_HASH" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Find the drift issue this decision answers
        id: issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Matched on the hash the approval was raised for, not the hash
          # detected now — a stale decision still answers its original issue.
          HASH=$(jq -r '.driftHash // empty' /tmp/drift-decision.json)
          if [ -n "$HASH" ]; then
            gh issue list --state open --label amcm-drift --limit 100 \
              --json number,url,body \
              --jq "[.[] | select(.body | contains(\"$HASH\"))][0] // {}" > /tmp/drift-issue-ref.json
            echo "number=$(jq -r '.number // empty' /tmp/drift-issue-ref.json)" >> "$GITHUB_OUTPUT"
            echo "url=$(jq -r '.url // empty' /tmp/drift-issue-ref.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Approved and current — sync drift to main
        if: steps.verify.outputs.decision == 'approved' && steps.verify.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISC_TENANT_URL: ${{ secrets.ISC_TENANT_URL }}
          ISC_CLIENT_ID: ${{ secrets.ISC_CLIENT_ID }}
          ISC_CLIENT_SECRET: ${{ secrets.ISC_CLIENT_SECRET }}
        run: |
          node scripts/cli.mjs backup --snapshot /tmp/isc-snapshot.json
          git config user.name "amcm-bot"
          git config user.email "amcm-bot[bot]@users.noreply.github.com"
          git add access/
          git commit -m "chore(backup): sync drift from ISC (governance approved)" || true
          jq -n --slurpfile d /tmp/drift-now.json --arg issue "${{ steps.issue.outputs.url }}" \
            '{added:$d[0].added, changed:$d[0].changed, deleted:$d[0].deleted, driftHash:$d[0].driftHash, decision:"approved", issueUrl:$issue, modifiers:($d[0].actors.modifiers // [])}' \
            | node scripts/cli.mjs ledger-drift
          git fetch origin '+refs/tags/known-good/*:refs/tags/known-good/*' '+refs/tags/isc-applied/*:refs/tags/isc-applied/*'
          node scripts/cli.mjs readme
          git add changes/ README.md
          git commit -m "chore(backup): record drift ledger" || true
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i), rebasing onto origin/main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done

      - name: Approved but stale — nothing synced, next backup will re-ask
        if: steps.verify.outputs.decision == 'approved' && steps.verify.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # This is a final report, not an open question — nothing further
          # happens on it, so close it immediately instead of leaving it for
          # someone to notice and close by hand.
          STALE_URL=$(gh issue create \
            --title "Drift approval stale $(date -u +%Y-%m-%d)" \
            --body "Governance approved syncing drift hash \`$(jq -r .driftHash /tmp/drift-decision.json)\`, but ISC changed again before this ran (now \`$(jq -r .driftHash /tmp/drift-now.json)\`). Nothing was synced to \`main\`. The next scheduled backup will detect the current drift and request approval again.")
          gh issue close "$STALE_URL" --reason "not planned"

      - name: Rejected — put ISC back to match git
        if: steps.verify.outputs.decision == 'rejected'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISC_TENANT_URL: ${{ secrets.ISC_TENANT_URL }}
          ISC_CLIENT_ID: ${{ secrets.ISC_CLIENT_ID }}
          ISC_CLIENT_SECRET: ${{ secrets.ISC_CLIENT_SECRET }}
        run: |
          set +e
          node scripts/cli.mjs restore --execute --snapshot /tmp/isc-snapshot.json > /tmp/restore.json
          STATUS=$?
          set -e
          cat /tmp/restore.json
          OK=false
          if [ "$STATUS" = "0" ] && [ "$(jq -r '.ok // false' /tmp/restore.json 2>/dev/null)" = "true" ]; then
            OK=true
          fi

          COMMENT=$(jq -r '.comment // empty' /tmp/drift-decision.json)
          if [ "$OK" = "true" ]; then
            # -r: without it jq prints the JSON-quoted string itself (literal
            # \n and surrounding quotes) instead of the markdown it holds.
            jq -rn --arg comment "$COMMENT" --slurpfile r /tmp/restore.json '
              def names:
                if length == 0 then "_none_"
                else
                  (.[0:40] | map("- `" + (.type // "?") + "` " + (.name // "?")) | join("\n"))
                  + (if length > 40 then "\n\n_and " + ((length - 40) | tostring) + " more" else "" end)
                end;
              "## Drift rejected — ISC restored to match git\n\n"
              + (if $comment != "" then "Comment: " + $comment + "\n\n" else "" end)
              + "Applied (" + ([$r[0].results[]? | select(.status=="applied")] | length | tostring) + ")\n"
              + ([$r[0].results[]? | select(.status=="applied")] | names) + "\n\n"
              + "Skipped (" + ([$r[0].results[]? | select(.status=="skipped")] | length | tostring) + ")\n"
              + ([$r[0].results[]? | select(.status=="skipped")] | names) + "\n\n"
              + "Skipped operations are entitlements this repo cannot create or delete. If any remain, the next backup will ask again."
            ' > /tmp/drift-issue.md
            TITLE="Drift rejected — ISC restored $(date -u +%Y-%m-%d)"
          else
            jq -rn --arg comment "$COMMENT" --slurpfile r /tmp/restore.json '
              "## Drift rejected — restore of ISC failed\n\n"
              + (if $comment != "" then "Comment: " + $comment + "\n\n" else "" end)
              + "Governance rejected the drift, but putting ISC back to match git stopped before it finished. ISC may be only partly restored.\n\n"
              + "```json\n" + (($r[0].failed // {error:"restore produced no result"}) | tostring) + "\n```"
            ' > /tmp/drift-issue.md
            TITLE="Drift rejected — ISC restore failed $(date -u +%Y-%m-%d)"
          fi
          ISSUE_URL=$(gh issue create --title "$TITLE" --body-file /tmp/drift-issue.md)
          # A successful restore is a final report — nothing further happens
          # on it. A failed one needs a human to look at a partly-restored
          # ISC, so leave that case open like the other failure issues.
          if [ "$OK" = "true" ]; then
            gh issue close "$ISSUE_URL" --reason completed
          fi

          git config user.name "amcm-bot"
          git config user.email "amcm-bot[bot]@users.noreply.github.com"
          jq -n --slurpfile d /tmp/drift-now.json --arg issue "$ISSUE_URL" --argjson restored "$OK" \
            '{added:$d[0].added, changed:$d[0].changed, deleted:$d[0].deleted, driftHash:$d[0].driftHash, decision:"rejected", restored:$restored, issueUrl:$issue, modifiers:($d[0].actors.modifiers // [])}' \
            | node scripts/cli.mjs ledger-drift
          git fetch origin '+refs/tags/known-good/*:refs/tags/known-good/*' '+refs/tags/isc-applied/*:refs/tags/isc-applied/*'
          node scripts/cli.mjs readme
          git add access/ changes/ README.md
          if [ "$OK" = "true" ]; then
            git diff --cached --quiet || git commit -m "chore(backup): rejected drift — restored ISC to match git"
          else
            git diff --cached --quiet || git commit -m "chore(backup): rejected drift — ISC restore failed"
          fi
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i), rebasing onto origin/main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          test "$OK" = "true"

      - name: Expired — record decision, ISC unchanged
        if: steps.verify.outputs.decision == 'expired'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          COMMENT=$(jq -r '.comment // empty' /tmp/drift-decision.json)
          jq -r --arg comment "$COMMENT" '
            def preview:
              if length == 0 then "_none_"
              else
                (.[0:40] | map("- `" + . + "`") | join("\n"))
                + (if length > 40 then "\n\n_and " + ((length - 40) | tostring) + " more" else "" end)
              end;
            "## Drift expired\n\n"
            + "Nobody acted before the timeout. ISC was left unchanged and nothing was copied into git.\n\n"
            + (if $comment != "" then "Comment: " + $comment + "\n\n" else "" end)
            + "### Added (" + (.added | length | tostring) + ")\n" + (.added | preview) + "\n\n"
            + "### Changed (" + (.changed | length | tostring) + ")\n" + (.changed | preview) + "\n\n"
            + "### Deleted (" + (.deleted | length | tostring) + ")\n" + (.deleted | preview) + "\n\n"
            + "The next scheduled backup will detect this drift again and request approval."
          ' /tmp/drift-now.json > /tmp/drift-issue.md
          ISSUE_URL=$(gh issue create --title "Drift expired $(date -u +%Y-%m-%d)" --body-file /tmp/drift-issue.md)
          # Final report, nothing further happens on it — the next backup
          # files a fresh issue if the drift is still there.
          gh issue close "$ISSUE_URL" --reason "not planned"

          git config user.name "amcm-bot"
          git config user.email "amcm-bot[bot]@users.noreply.github.com"
          jq -n --slurpfile d /tmp/drift-now.json --arg issue "$ISSUE_URL" \
            '{added:$d[0].added, changed:$d[0].changed, deleted:$d[0].deleted, driftHash:$d[0].driftHash, decision:"expired", restored:false, issueUrl:$issue, modifiers:($d[0].actors.modifiers // [])}' \
            | node scripts/cli.mjs ledger-drift
          git fetch origin '+refs/tags/known-good/*:refs/tags/known-good/*' '+refs/tags/isc-applied/*:refs/tags/isc-applied/*'
          node scripts/cli.mjs readme
          git add changes/ README.md
          git diff --cached --quiet || git commit -m "chore(backup): record drift decision (expired)"
          for i in 1 2 3 4 5; do
            git push && break
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done

      - name: Close the drift issue this decision answers
        if: always() && steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          OUTCOME="${{ steps.verify.outputs.decision }}"
          if [ "$OUTCOME" = "approved" ] && [ "${{ steps.verify.outputs.stale }}" = "true" ]; then
            OUTCOME=stale
          fi
          node scripts/cli.mjs drift-comment \
            --decision "$OUTCOME" \
            --message "$(jq -r '.comment // empty' /tmp/drift-decision.json)" \
            --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > /tmp/drift-close.md
          gh issue comment "$NUMBER" --body-file /tmp/drift-close.md
          # Closed even when stale: ISC has moved on, so the drift this issue
          # describes no longer exists and the next backup files a fresh one.
          # Accepted drift is a deliberate "leave it as-is" call, not work that
          # got done, so it closes as not planned; every other outcome
          # (rejected/expired/stale) means the issue's job — getting a
          # decision recorded — is done, so it closes as completed.
          if [ "$OUTCOME" = "approved" ]; then
            gh issue close "$NUMBER" --reason "not planned"
          else
            gh issue close "$NUMBER" --reason completed
          fi
